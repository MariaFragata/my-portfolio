<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Christine — developer and creative coder building soft pixels on top of solid logic." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFDF5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1712" />
    <title>Christine — Soft pixels, solid logic.</title>
    <link rel="preload" href="/fonts/fraunces-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem('christine-theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
